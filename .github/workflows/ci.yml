name: VeriSum Platform CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint-and-test:
    name: 1. Code Lint & Backend/Frontend Unit & Integration Tests
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Build Shared Common Library
        run: npm run build --workspace=@verisumm/common

      - name: Lint Codebase & Type Check
        run: |
          npm run lint || true

      - name: Run Backend Unit & Integration Tests with Coverage Thresholds
        env:
          MONGO_URI: mongodb://localhost:27017/verisumm_test
          REDIS_URL: redis://localhost:6379
          DEPLOYMENT_MODE: offline
          JWT_SECRET: ci-pipeline-test-jwt-secret
        run: |
          cd backend
          npm run test:coverage

      - name: Upload Coverage Reports to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-report
          path: backend/coverage/

  docker-build:
    name: 2. Production Docker Images Build Verification
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: |
          ./infra/nginx/generate-certs.sh
          docker compose -f infra/docker-compose.prod.yml config

      - name: Build Backend Docker Image
        run: docker build -t verisumm-backend:ci -f backend/Dockerfile .

      - name: Build Worker Docker Image
        run: docker build -t verisumm-worker:ci -f worker/Dockerfile .

      - name: Build Frontend Docker Image
        run: docker build -t verisumm-frontend:ci -f frontend/Dockerfile .

      - name: Build Model Service Docker Image
        run: docker build -t verisumm-model-service:ci model-service/

  e2e-playwright:
    name: 3. End-to-End Playwright Automated Browser Suite
    runs-on: ubuntu-latest
    needs: docker-build

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Build All Workspaces
        run: npm run build:all

      - name: Launch Test Backend & Frontend
        env:
          DEPLOYMENT_MODE: offline
          PORT: 5000
          NODE_ENV: test
        run: |
          npm run dev:backend &
          npm run dev:frontend &
          sleep 5

      - name: Execute Playwright E2E Test Suite
        run: npm run test:e2e
        env:
          E2E_BASE_URL: http://localhost:5173

      - name: Upload Playwright HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/

  security-audit:
    name: 4. Dependency Vulnerability Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run NPM Audit Vulnerability Scan
        run: npm audit --audit-level=high || true
